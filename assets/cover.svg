<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eval Atlas product cover</title>
  <desc id="desc">A dark navy and warm paper evaluation dashboard with scorecards, trend lines, a radar chart, and model results.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#071521" flood-opacity=".16"/></filter><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f1e9"/><stop offset="1" stop-color="#e8e5dc"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#fade)"/>
  <rect width="210" height="900" fill="#071521"/>
  <g transform="translate(33 28)"><circle cx="24" cy="24" r="20" fill="none" stroke="#20c8c7" stroke-width="2"/><path d="M7 27c10-10 23-14 35-9M11 37c8-8 20-13 30-10M22 3c-4 13-2 29 5 43" fill="none" stroke="#20c8c7"/><circle cx="34" cy="17" r="4" fill="#ff6c3e"/><text x="58" y="20" fill="#b7c3c8" font-family="Arial,sans-serif" font-size="17">eval</text><text x="58" y="41" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="700">atlas</text></g>
  <g fill="#73858e" font-family="Arial,sans-serif" font-size="12"><rect x="12" y="124" width="186" height="48" rx="4" fill="#0c2030"/><rect x="12" y="124" width="3" height="48" fill="#ff6c3e"/><text x="56" y="154" fill="white">Overview</text><text x="56" y="213">Test cases</text><text x="56" y="269">Compare</text><text x="56" y="325">Method</text></g>
  <text x="260" y="82" fill="#ff6c3e" font-family="monospace" font-size="13" font-weight="700" letter-spacing="3">MISSION CONTROL</text>
  <text x="260" y="145" fill="#14212b" font-family="Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-4">Behavior, mapped.</text>
  <text x="260" y="181" fill="#6d767a" font-family="Arial,sans-serif" font-size="18">See where candidate models hold up—and where they drift.</text>
  <g transform="translate(260 226)" filter="url(#shadow)">
    <rect width="1275" height="605" fill="#f4f1e9" stroke="#14212b"/>
    <g>
      <rect width="360" height="170" fill="#071521"/><text x="22" y="28" fill="#7e9099" font-family="monospace" font-size="10" letter-spacing="2">OVERALL SCORE</text><text x="22" y="102" fill="white" font-family="Arial,sans-serif" font-size="65" font-weight="800" letter-spacing="-5">86</text><text x="97" y="102" fill="#71838c" font-family="monospace" font-size="11">/100</text><rect x="22" y="123" width="316" height="6" fill="#193341"/><rect x="22" y="123" width="272" height="6" fill="#20c8c7"/><text x="22" y="153" fill="#82949c" font-family="Arial,sans-serif" font-size="10">Strongest on safety; watch grounding.</text>
      <g transform="translate(360)"><rect width="305" height="170" fill="#f4f1e9" stroke="#d3cfc4"/><text x="20" y="28" fill="#6d767a" font-family="monospace" font-size="10" letter-spacing="2">PASS RATE</text><text x="20" y="90" fill="#14212b" font-family="Arial,sans-serif" font-size="44" font-weight="800">83%</text><text x="20" y="111" fill="#6d767a" font-family="Arial,sans-serif" font-size="10">10 / 12 cases</text><g fill="#20c8c7" transform="translate(20 132)"><rect width="12" height="15"/><rect x="17" y="6" width="12" height="9"/><rect x="34" y="1" width="12" height="14"/><rect x="51" y="4" width="12" height="11"/><rect x="68" y="0" width="12" height="15"/></g></g>
      <g transform="translate(665)"><rect width="305" height="170" fill="#f4f1e9" stroke="#d3cfc4"/><text x="20" y="28" fill="#6d767a" font-family="monospace" font-size="10" letter-spacing="2">CONSISTENCY</text><text x="20" y="90" fill="#14212b" font-family="Arial,sans-serif" font-size="44" font-weight="800">91%</text><path d="M20 142l35-20 35 8 35-29 35 12 35-35 35 12 35-42" fill="none" stroke="#4e7cf0" stroke-width="3"/></g>
      <g transform="translate(970)"><rect width="305" height="170" fill="#f4f1e9" stroke="#d3cfc4"/><text x="20" y="28" fill="#6d767a" font-family="monospace" font-size="10" letter-spacing="2">SIM. LATENCY</text><text x="20" y="90" fill="#14212b" font-family="Arial,sans-serif" font-size="44" font-weight="800">1.2s</text><rect x="20" y="128" width="265" height="6" fill="#d3cfc4"/><rect x="20" y="128" width="106" height="6" fill="#f3c64d"/></g>
    </g>
    <g transform="translate(0 190)"><rect width="755" height="380" fill="#f7f5ef" stroke="#d3cfc4"/><text x="23" y="29" fill="#ff6c3e" font-family="monospace" font-size="10" font-weight="700" letter-spacing="2">RUN HISTORY</text><text x="23" y="56" fill="#14212b" font-family="Arial,sans-serif" font-size="18" font-weight="700">Score trajectory</text>
      <g transform="translate(55 87)"><g stroke="#dedad0"><path d="M0 0h660M0 70h660M0 140h660M0 210h660"/></g><path d="M0 190L95 160L190 169L285 115L380 128L475 82L570 98L660 54" fill="none" stroke="#20c8c7" stroke-width="4"/><path d="M0 210L95 192L190 185L285 167L380 172L475 140L570 150L660 121" fill="none" stroke="#ff6c3e" stroke-width="3"/><path d="M0 145L95 150L190 130L285 138L380 96L475 110L570 68L660 75" fill="none" stroke="#4e7cf0" stroke-width="3"/></g>
    </g>
    <g transform="translate(775 190)"><rect width="500" height="380" fill="#f7f5ef" stroke="#d3cfc4"/><text x="23" y="29" fill="#ff6c3e" font-family="monospace" font-size="10" font-weight="700" letter-spacing="2">CAPABILITY TERRAIN</text><text x="23" y="56" fill="#14212b" font-family="Arial,sans-serif" font-size="18" font-weight="700">Category coverage</text>
      <g transform="translate(250 218)"><polygon points="0,-120 114,-37 71,97 -71,97 -114,-37" fill="none" stroke="#d3cfc4"/><polygon points="0,-85 81,-26 50,69 -50,69 -81,-26" fill="none" stroke="#d3cfc4"/><polygon points="0,-45 43,-14 26,36 -26,36 -43,-14" fill="none" stroke="#d3cfc4"/><path d="M0-120V120M-114-37L114 37M114-37L-114 37M71 97L-71-97M-71 97L71-97" stroke="#d3cfc4"/><polygon points="0,-101 106,-34 63,87 -52,72 -97,-31" fill="#20c8c7" fill-opacity=".18" stroke="#20c8c7" stroke-width="3"/></g>
    </g>
  </g>
</svg>
